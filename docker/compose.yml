# Scribodo's local services (SOW §5-6): MariaDB (structured authority) and
# Qdrant (rebuildable semantic index). Both listen on 127.0.0.1 only and
# require credentials generated by tools/services.sh, never defaults.
# Images are pinned by digest; data lives in named volumes.
name: scribodo

services:
  mariadb:
    image: mariadb:11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_ai_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=32
      - --skip-name-resolve
    environment:
      MARIADB_DATABASE: scribodo
      MARIADB_USER: scribodo
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${SCRIBODO_DB_PORT:-33061}:3306"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: ${SCRIBODO_MARIADB_MEM_LIMIT:-768m}

  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    restart: unless-stopped
    env_file:
      - ${SCRIBODO_SECRETS:?run tools/services.sh}/qdrant.env
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${SCRIBODO_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: ${SCRIBODO_QDRANT_MEM_LIMIT:-1g}

secrets:
  db_password:
    file: ${SCRIBODO_SECRETS:?run tools/services.sh}/db_password
  db_root_password:
    file: ${SCRIBODO_SECRETS:?run tools/services.sh}/db_root_password

volumes:
  mariadb:
  qdrant:
