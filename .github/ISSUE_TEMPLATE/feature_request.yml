name: Feature request
description: Suggest a change to how Scribodo works
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do as an author, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: The change you have in mind, if any. Scribodo stays local-first and keeps the author in charge of documents and canon (README, Principles).
