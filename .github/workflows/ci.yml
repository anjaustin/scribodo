name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and unit suites
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out pinned dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Build the application
        env:
          ARCH_FLAGS: ""
        run: make all

      - name: Run headless tests
        env:
          ARCH_FLAGS: ""
        run: make test

  sanitize:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out pinned dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ARCH_FLAGS: ""
        run: make sanitize

  tsan:
    name: ThreadSanitizer
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out pinned dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Run ThreadSanitizer
        env:
          ARCH_FLAGS: ""
        run: make tsan

  ui-canary:
    name: Scripted UI canary
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out pinned dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Run scripted UI suite
        env:
          ARCH_FLAGS: ""
        run: make uitest

      - name: Upload UI failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ui
            build/hangs
          if-no-files-found: ignore
