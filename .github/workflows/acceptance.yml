name: Trusted acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Trusted database and UI acceptance
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, scribodo-trusted]
    timeout-minutes: 90
    env:
      # The services run natively on the runner (the author's Mac; tools/services_lib.sh): their own data under the
      # job's temporary folder, on ports beside the author's, purged at the end. The compose project name stays for a
      # run that sets SCRIBODO_SERVICES=docker by hand.
      SCRIBODO_SERVICES: native
      SCRIBODO_COMPOSE_PROJECT: scribodo-ci
      SCRIBODO_DB_PORT: "33062"
      SCRIBODO_QDRANT_PORT: "6334"
      # For a docker-mode run on the shared VM (pinned to 3,072 MiB): both stacks' caps fit.
      SCRIBODO_MARIADB_MEM_LIMIT: "512m"
      SCRIBODO_QDRANT_MEM_LIMIT: "768m"
    steps:
      - name: Check out pinned dependencies
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          submodules: recursive

      - name: Configure native tools
        run: |
          echo "$HOME/.docker/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "SCRIBODO_SECRETS=$RUNNER_TEMP/scribodo-services" >> "$GITHUB_ENV"
          echo "SCRIBODO_LOGS=$RUNNER_TEMP/scribodo-logs" >> "$GITHUB_ENV"
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Fetch the pinned Qdrant binary
        run: make qdrant
      - name: Rehearse the native services on throwaway stores
        run: make servicestest

      - name: Start pinned local services
        run: tools/services.sh up

      - name: Build and run database integration
        run: caffeinate -i make all test dbtest crashtest

      # The eight mutation controls (AUDIT-004 F9): each weakened guard must fail its suite. About 6 minutes on the
      # author's Mac; three of them need the services started above, so they run here and not on hosted CI.
      - name: Run mutation controls
        run: caffeinate -i make mutationtest mutationtest-db

      - name: Run scripted UI acceptance
        run: caffeinate -i make uitest

      - name: Run store UI acceptance
        run: caffeinate -i make uitest-db

      - name: Run scheduled recovery acceptance
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: caffeinate -i make backuptest remotetest

      - name: Remove disposable services and volumes
        if: always()
        # Only the job's own store: if the step that sets SCRIBODO_SECRETS never ran, there is nothing of the job's
        # to remove, and the default folder is the author's (REDTEAM-023).
        run: |
          if [ -n "${SCRIBODO_SECRETS:-}" ] && [ "${SCRIBODO_SECRETS#"$RUNNER_TEMP"}" != "$SCRIBODO_SECRETS" ]; then
            tools/services.sh purge
          else
            echo "no job store to remove"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trusted-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ui
            build/hangs
            ${{ runner.temp }}/scribodo-logs
          if-no-files-found: ignore
